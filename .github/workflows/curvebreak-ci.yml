name: Curvebreak Build

on:
  push:
    branches: [curvebreak-ci-v2]
    paths:
      - "curvebreak-build/**"
      - ".github/workflows/curvebreak-ci.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "21"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"

      - name: Build Curvebreak
        working-directory: curvebreak-build
        run: gradle build --stacktrace

      - name: Upload JARs
        uses: actions/upload-artifact@v4
        with:
          name: curvebreak-1.21.11
          path: curvebreak-build/build/libs/*.jar
          if-no-files-found: error
