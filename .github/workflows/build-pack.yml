name: Build resource pack

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image validation dependency
        run: python -m pip install -r requirements.txt
      - name: Test pack validation
        run: python -m unittest discover -s tests -v
      - name: Build install-ready ZIP
        run: python tools/build_release.py --root .
      - name: Verify ZIP root and metadata
        run: python tools/verify_pack.py release/AutumnVoid-PvP-1.0.0.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AutumnVoid-PvP-1.0.0
          path: release/AutumnVoid-PvP-1.0.0.zip
